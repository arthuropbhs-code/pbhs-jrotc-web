<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{heading}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:Arial, Helvetica, sans-serif;">
  <!-- Preheader (hidden preview text in inbox list) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
    {{heading}} - PBHS JROTC Command Portal
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:24px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.08);">

          <!-- HEADER -->
          <tr>
            <td style="background-color:#0a0c12; padding:32px 40px; text-align:center;">
              <p style="margin:0; font-size:12px; font-weight:900; letter-spacing:4px; color:#eab308; text-transform:uppercase; font-family:Arial, sans-serif;">
                PBHS JROTC &middot; Tornado Battalion
              </p>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding:40px;">

              <!-- {{{banner}}} is either empty, or a full <table> security-notice
                   block - the code decides which, this template just drops it in.
                   Triple braces = EmailJS's unescaped-HTML syntax; double braces
                   would print the tags as literal visible text instead of
                   rendering them. -->
              {{{banner}}}

              <h1 style="margin:0 0 16px; font-size:24px; font-weight:900; color:#0f172a; text-transform:uppercase; letter-spacing:-0.5px;">
                {{heading}}
              </h1>

              <!-- {{{message}}} is pre-built HTML (a <p> or two) supplied by the
                   code, so it can bold specific values like an email address
                   inline. -->
              {{{message}}}

              <!-- {{{cta}}} is either empty, or a full button <table> block. -->
              {{{cta}}}

              <div style="border-top:1px solid #e2e8f0; padding-top:20px; margin-top:8px;">
                <p style="margin:0; font-size:12px; line-height:1.6; color:#94a3b8;">
                  {{footnote}}
                </p>
              </div>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background-color:#f8fafc; padding:24px 40px; text-align:center; border-top:1px solid #e2e8f0;">
              <p style="margin:0; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#94a3b8;">
                PBHS JROTC Tornado Battalion &middot; Command Portal
              </p>
              <p style="margin:8px 0 0; font-size:10px; color:#cbd5e1;">
                This is an automated message. Please do not reply to this email.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
