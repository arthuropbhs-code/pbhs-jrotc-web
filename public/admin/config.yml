backend:
  name: git-gateway
  branch: main

media_folder: "public/covers" # Where cadet portraits will be uploaded
public_folder: "/covers" # The path your React code will read

collections:
  - name: "leadership"
    label: "Battalion Leadership"
    folder: "src/data/cms"
    create: true
    slug: "{{role}}-{{name}}"
    fields:
      - { label: "Full Name", name: "name", widget: "string" }
      - { label: "Role/Position Title", name: "role", widget: "string", hint: "e.g., Battalion Commander, S-1 Adjutant, Commander, First Sergeant" }
      - { label: "Rank Shortcode", name: "rank", widget: "string", hint: "e.g., c/LTC, c/1SG, c/CPT" }
      - { label: "Portrait Photo", name: "portrait", widget: "image", required: false }
      - { label: "Staff Description", name: "desc", widget: "string", required: false, hint: "Only used for S-staff members (e.g. Personnel & Administration)" }
      - { label: "Leadership Quote", name: "quote", widget: "string", required: false }
      - {
          label: "Company Assignment", 
          name: "company", 
          widget: "select", 
          options: ["None", "Alpha Company", "Bravo Company", "Charlie Company", "Delta Company", "Echo Company"], 
          default: "None",
          hint: "Leave as None if this is a Battalion Staff or Command position."
        }
  - name: "instructors"
    label: "Instructors"
    folder: "src/data/cms_instructors"
    create: true
    delete: false
    slug: "{{type}}-{{name}}"
    fields:
      - { label: "Instructor Type", name: "type", widget: "select", options: ["SAI", "AI"] }
      - { label: "Rank and Last Name", name: "name", widget: "string", hint: "e.g., LTC Johnson, 1SG Chevrestt" }
  - name: "announcements"
    label: "Announcements"
    folder: "src/data/announcements"
    create: true
    delete: true 
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description / Body Content", name: "body", widget: "markdown" }
      - { label: "Date Issued", name: "date_issued", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Issued By (Name/Role)", name: "issued_by", widget: "string", hint: "e.g., LTC Johnson, c/LTC Washington" }
      - { label: "Notice Ends (Expiration Date)", name: "notice_ends", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false, required: false, hint: "Optional: When this announcement should stop displaying or archiving." }
      - { label: "Announcement Image", name: "image", widget: "image", required: false, hint: "Optional: Attach an image banner to this announcement." }