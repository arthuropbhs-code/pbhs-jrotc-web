# Uptime check for pbhsjrotc.com
# Runs every 15 minutes and checks that the site returns HTTP 200.
# If it fails, GitHub sends an email notification to the repo owner automatically
# (same as any other failing workflow). Check your repository's notification settings
# to ensure "Failed workflows" alerts are enabled (they are by default).

name: Uptime Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  check:
    name: ping pbhsjrotc.com
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check site returns HTTP 200
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://pbhsjrotc.com/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Site returned HTTP $STATUS — expected 200"
            exit 1
          fi

      - name: Check /sitemap.xml is reachable
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://pbhsjrotc.com/sitemap.xml)
          echo "Sitemap HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Sitemap returned HTTP $STATUS"
          fi
