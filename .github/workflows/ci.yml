name: CI

# Runs on every push and PR to main. This does NOT deploy anything - Vercel's
# own GitHub integration already builds and deploys on push independently of
# this workflow. This is purely a correctness gate: lint, unit tests, and a
# production build all have to pass before a change is considered good.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
